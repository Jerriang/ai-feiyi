<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理</title>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#F9F6F0] text-gray-800" x-data="adminApp()" x-init="init()">
  <main class="mx-auto max-w-5xl p-4 sm:p-6">
    <section x-show="!authorized" class="mx-auto mt-16 max-w-md rounded-2xl border border-[#E7E2D9] bg-white p-6 shadow-sm">
      <h1 class="text-2xl font-semibold text-[#C43C3C]">管理员登录</h1>
      <p class="mt-1 text-sm text-gray-500">请输入邮箱与密码</p>
      <div class="mt-4 space-y-3">
        <input x-model="login.email" type="email" placeholder="管理员邮箱" class="w-full rounded-xl border border-[#E7E2D9] px-3 py-2" />
        <input x-model="login.password" type="password" placeholder="密码" class="w-full rounded-xl border border-[#E7E2D9] px-3 py-2" />
        <button @click="doLogin" class="w-full rounded-xl bg-[#C43C3C] py-2 font-semibold text-white">登录</button>
      </div>
      <p class="mt-2 text-xs text-gray-500">默认账号：admin@heritage.local / admin123</p>
      <p class="mt-2 text-sm text-red-600" x-text="error"></p>
    </section>

    <section x-show="authorized" class="space-y-4">
      <div class="flex gap-2">
        <button @click="activeTab='content'" :class="activeTab==='content' ? 'bg-[#C43C3C] text-white' : 'bg-white text-gray-700'" class="rounded-xl border border-[#E7E2D9] px-3 py-2 text-sm">内容管理</button>
        <button @click="activeTab='overview'; loadOverview()" :class="activeTab==='overview' ? 'bg-[#C43C3C] text-white' : 'bg-white text-gray-700'" class="rounded-xl border border-[#E7E2D9] px-3 py-2 text-sm">数据概览</button>
      </div>

      <div x-show="activeTab==='content'" class="space-y-4">
        <header class="flex items-center justify-between rounded-2xl border border-[#E7E2D9] bg-white p-4">
          <div>
            <h2 class="text-xl font-semibold">非遗内容管理</h2>
            <p class="text-sm text-gray-500">点击卡片可编辑 description / image_url</p>
          </div>
          <button class="rounded-xl border border-[#E7E2D9] px-3 py-2 text-sm">新建</button>
        </header>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
          <template x-for="item in items" :key="item.id">
            <article @click="openEdit(item)" class="cursor-pointer rounded-2xl border border-[#E7E2D9] bg-white p-4 shadow-sm hover:shadow-md transition">
              <img :src="item.image_url || placeholder" class="h-36 w-full rounded-xl object-cover" alt="cover" />
              <h3 class="mt-3 font-semibold" x-text="item.name"></h3>
              <p class="text-xs text-gray-500" x-text="`${item.city} · ${item.category}`"></p>
              <p class="mt-2 line-clamp-3 text-sm text-gray-600" x-text="item.description || item.summary"></p>
            </article>
          </template>
        </div>
      </div>

      <div x-show="activeTab==='overview'" class="space-y-4">
        <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
          <div class="rounded-2xl border border-[#E7E2D9] bg-white p-3"><p class="text-xs text-gray-500">今日导览完成</p><p class="mt-1 text-2xl font-semibold" x-text="overview.guide_complete_today"></p></div>
          <div class="rounded-2xl border border-[#E7E2D9] bg-white p-3"><p class="text-xs text-gray-500">平均导览时长</p><p class="mt-1 text-2xl font-semibold" x-text="Math.round(overview.avg_guide_duration_seconds || 0) + 's'"></p></div>
          <div class="rounded-2xl border border-[#E7E2D9] bg-white p-3"><p class="text-xs text-gray-500">海报生成数量</p><p class="mt-1 text-2xl font-semibold" x-text="overview.poster_generate_today"></p></div>
          <div class="rounded-2xl border border-[#E7E2D9] bg-white p-3"><p class="text-xs text-gray-500">海报分享率</p><p class="mt-1 text-2xl font-semibold" x-text="(overview.poster_share_rate * 100).toFixed(1) + '%'"></p></div>
        </div>
        <div class="rounded-2xl border border-[#E7E2D9] bg-white p-4">
          <canvas id="analyticsChart" height="120"></canvas>
        </div>
      </div>
    </section>
  </main>

  <div x-show="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" x-cloak>
    <div class="w-full max-w-2xl rounded-2xl bg-white p-4 sm:p-6">
      <div class="mb-3 flex items-center justify-between">
        <h3 class="text-lg font-semibold" x-text="`编辑：${editing.name || ''}`"></h3>
        <button @click="closeModal" class="rounded-lg px-2 py-1 text-gray-500">✕</button>
      </div>
      <div class="space-y-3">
        <input x-model="editing.image_url" type="text" placeholder="图片 URL" class="w-full rounded-xl border border-[#E7E2D9] px-3 py-2" />
        <div id="quillEditor" class="h-48"></div>
      </div>
      <div class="mt-4 flex justify-end gap-2">
        <button @click="closeModal" class="rounded-xl border border-[#E7E2D9] px-4 py-2">取消</button>
        <button @click="saveEdit" class="rounded-xl bg-[#C43C3C] px-4 py-2 font-semibold text-white">保存</button>
      </div>
      <p class="mt-2 text-sm text-green-600" x-text="success"></p>
    </div>
  </div>

  <script>
    function adminApp() {
      return {
        placeholder: 'https://images.unsplash.com/photo-1456324504439-367cee3b3c32?auto=format&fit=crop&w=800&q=80',
        login: { email: '', password: '' },
        token: localStorage.getItem('admin_token') || '',
        authorized: false,
        items: [],
        showModal: false,
        editing: {},
        quill: null,
        error: '',
        success: '',
        activeTab: 'content',
        overview: { guide_complete_today: 0, avg_guide_duration_seconds: 0, poster_generate_today: 0, poster_share_rate: 0 },
        chart: null,

        async init() {
          if (this.token) {
            const ok = await this.checkAuth();
            if (ok) {
              this.authorized = true;
              await this.fetchItems();
              return;
            }
          }
          if (!location.pathname.includes('/admin')) window.location.href = '/';
        },

        async doLogin() {
          this.error = '';
          const res = await fetch('/api/v1/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.login)
          });
          if (!res.ok) {
            this.error = '登录失败，请检查账号密码';
            return;
          }
          const data = await res.json();
          this.token = data.access_token;
          localStorage.setItem('admin_token', this.token);
          this.authorized = true;
          await this.fetchItems();
        },

        async checkAuth() {
          const res = await fetch('/api/v1/admin/me', { headers: { Authorization: `Bearer ${this.token}` } });
          if (!res.ok) {
            localStorage.removeItem('admin_token');
            this.token = '';
            return false;
          }
          return true;
        },

        async fetchItems() {
          const res = await fetch('/api/v1/admin/heritage-items', { headers: { Authorization: `Bearer ${this.token}` } });
          if (!res.ok) {
            this.authorized = false;
            window.location.href = '/';
            return;
          }
          this.items = await res.json();
        },

        async loadOverview() {
          const res = await fetch('/api/v1/analytics/overview', { headers: { Authorization: `Bearer ${this.token}` } });
          if (!res.ok) return;
          const data = await res.json();
          this.overview = data;
          this.$nextTick(() => {
            const ctx = document.getElementById('analyticsChart');
            if (!ctx) return;
            if (this.chart) this.chart.destroy();
            this.chart = new Chart(ctx, {
              type: 'bar',
              data: {
                labels: data.bars.labels,
                datasets: [{ label: '今日事件数', data: data.bars.values, backgroundColor: '#C43C3C' }]
              },
              options: { responsive: true, plugins: { legend: { display: false } } }
            });
          });
        },

        openEdit(item) {
          this.success = '';
          this.editing = JSON.parse(JSON.stringify(item));
          this.showModal = true;
          this.$nextTick(() => {
            if (!this.quill) this.quill = new Quill('#quillEditor', { theme: 'snow' });
            this.quill.root.innerHTML = this.editing.description || '';
          });
        },

        closeModal() { this.showModal = false; },

        async saveEdit() {
          this.editing.description = this.quill.root.innerHTML;
          const res = await fetch(`/api/v1/admin/heritage-items/${this.editing.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${this.token}` },
            body: JSON.stringify({ description: this.editing.description, image_url: this.editing.image_url })
          });
          if (!res.ok) { this.error = '保存失败'; return; }
          this.success = '保存成功，已更新文案';
          await this.fetchItems();
        }
      }
    }
  </script>
</body>
</html>
