<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>非遗主题</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { cinnabar: '#C43C3C', rice: '#F9F6F0', line: '#E7E2D9' },
          fontFamily: {
            serifCn: ['"Noto Serif SC"', 'serif'],
            sansCn: ['Inter', '"PingFang SC"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-rice font-sansCn text-gray-800 overflow-x-hidden">
  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6">
    <h1 class="font-serifCn text-3xl font-bold text-cinnabar">非遗主题</h1>
    <p class="mt-2 text-sm text-gray-600">选择主题，进入故事化导览与路线推荐。</p>
    <section class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      {% for item in items %}
      <article class="rounded-2xl border border-line bg-white p-5 shadow-sm">
        <p class="text-xs text-cinnabar">{{ item.city }} · {{ item.category }}</p>
        <h2 class="mt-2 font-serifCn text-xl font-semibold">{{ item.name }}</h2>
        <p class="mt-3 text-sm leading-6 text-gray-600">{{ item.summary }}</p>
        <div class="mt-4 flex gap-2">
          <a class="rounded-xl bg-cinnabar px-3 py-2 text-xs font-semibold text-white" href="/docs#/default/get_item_api_v1_heritage_items__item_id__get">详情 API</a>
          <a class="rounded-xl border border-line bg-white px-3 py-2 text-xs font-semibold" href="/docs#/default/generate_api_v1_guide_generate_post">AI 导览</a>
        </div>
      </article>
      {% endfor %}
    </section>
  </main>
</body>
</html>
